name = "printbridge-landing"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# crispdock.com from 1.2.0 on (www redirects to it in src/index.ts); the old workers.dev
# address stays on for links in apps up to 1.1.9.
workers_dev = true
routes = [
  { pattern = "crispdock.com", custom_domain = true },
  { pattern = "www.crispdock.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# The licence server's D1 (zp505-mac-bridge/license-server, which owns the schema and its
# migrations). This Worker only adds to traffic_daily: page views and /download clicks per day.
[[d1_databases]]
binding = "DB"
database_name = "printbridge-license"
database_id = "a433c056-e283-4d35-a5ec-da916d6572a2"

[vars]
PRINTBRIDGE_VERSION = "1.3.2"
# Lives in public/downloads/. /download always redirects here.
DOWNLOAD_FILE = "CrispDock-1.3.2.pkg"
DOWNLOAD_SIZE = "7.3 MB"
# Base URL of the licence server that runs checkout and the customer account, e.g.
# "https://api.crispdock.com" (no trailing slash needed). Buy buttons go
# to <CHECKOUT_BASE>/checkout?plan=monthly|yearly|lifetime and "Manage subscription" to
# <CHECKOUT_BASE>/account. Leave empty until checkout is ready: the buttons then show
# "Online checkout opens soon" and the account link is hidden.
CHECKOUT_BASE = "https://api.crispdock.com"
SUPPORT_EMAIL = "cs@crispdock.com"
